<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1650" viewBox="0 0 1600 1650"><rect width="100%" height="100%" fill="white"/><text x="50" y="50" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1b443a">Delivery System - application structure</text><text x="50" y="82" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">Key fields and methods. + public   - private   # protected   ~ package access. Routine getters omitted.</text><rect x="600" y="115" width="400" height="92" fill="none" stroke="#1b443a"/><rect x="600" y="115" width="400" height="44" fill="#f1f6f0" stroke="#1b443a"/><text x="616" y="144" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b443a">Main</text><text x="616" y="185" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ main(String[]): void</text><rect x="40" y="300" width="440" height="228" fill="none" stroke="#1b443a"/><rect x="40" y="300" width="440" height="44" fill="#f1f6f0" stroke="#1b443a"/><text x="56" y="329" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b443a">DeliveryApp extends JFrame</text><text x="56" y="370" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- system: DeliverySystem</text><text x="56" y="394" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- cart: LinkedHashMap&lt;String,Integer&gt;</text><path d="M40 410H480" stroke="#1b443a"/><text x="56" y="434" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- showLogin(): void</text><text x="56" y="458" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- showDashboard(String): void</text><text x="56" y="482" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- activityPage(): JPanel</text><text x="56" y="506" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- attempt(Action): void</text><rect x="1120" y="300" width="440" height="228" fill="none" stroke="#1b443a"/><rect x="1120" y="300" width="440" height="44" fill="#f1f6f0" stroke="#1b443a"/><text x="1136" y="329" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b443a">TerminalApp</text><text x="1136" y="370" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- system: DeliverySystem</text><text x="1136" y="394" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- input: Scanner</text><path d="M1120 410H1560" stroke="#1b443a"/><text x="1136" y="434" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ run(): void</text><text x="1136" y="458" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- adminOption(String): void</text><text x="1136" y="482" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- customerOption(String): void</text><text x="1136" y="506" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- driverOption(String): void</text><rect x="550" y="650" width="500" height="444" fill="none" stroke="#1b443a"/><rect x="550" y="650" width="500" height="44" fill="#f1f6f0" stroke="#1b443a"/><text x="566" y="679" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b443a">DeliverySystem</text><text x="566" y="720" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- files: FileManager</text><text x="566" y="744" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- menu: Menu</text><text x="566" y="768" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- users: LinkedHashMap&lt;String,User&gt;</text><text x="566" y="792" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- allOrders: LinkedHashMap&lt;Integer,Order&gt;</text><text x="566" y="816" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- ordersQueue: Queue&lt;Order&gt;</text><text x="566" y="840" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- readyDrivers: PriorityQueue&lt;Driver&gt;</text><text x="566" y="864" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- currentUser: User</text><path d="M550 880H1050" stroke="#1b443a"/><text x="566" y="904" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ login(String,String): User</text><text x="566" y="928" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ register(...): void</text><text x="566" y="952" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ placeOrder(List&lt;String&gt;): Order</text><text x="566" y="976" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- giveOrderToDriver(): void</text><text x="566" y="1000" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ startDelivery(int): void</text><text x="566" y="1024" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ completeDelivery(int): void</text><text x="566" y="1048" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ rateDriver(int,int): void</text><text x="566" y="1072" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ getActivity(): ArrayList&lt;ActivityEntry&gt;</text><rect x="550" y="1190" width="500" height="348" fill="none" stroke="#1b443a"/><rect x="550" y="1190" width="500" height="44" fill="#f1f6f0" stroke="#1b443a"/><text x="566" y="1219" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b443a">FileManager implements AutoCloseable</text><text x="566" y="1260" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- directory: Path</text><text x="566" y="1284" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- lock: FileLock</text><text x="566" y="1308" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- actor: String</text><text x="566" y="1332" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- actorRole: String</text><path d="M550 1348H1050" stroke="#1b443a"/><text x="566" y="1372" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ loadMenu(): Menu</text><text x="566" y="1396" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ loadUsers(): LinkedHashMap</text><text x="566" y="1420" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ loadOrders(users): LinkedHashMap</text><text x="566" y="1444" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ saveUsers(users,role): void</text><text x="566" y="1468" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ appendOrder(order,ratings): void</text><text x="566" y="1492" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ log(event,details): void</text><text x="566" y="1516" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ loadActivity(User): ArrayList&lt;ActivityEntry&gt;</text><rect x="40" y="1210" width="430" height="180" fill="none" stroke="#1b443a"/><rect x="40" y="1210" width="430" height="44" fill="#f1f6f0" stroke="#1b443a"/><text x="56" y="1239" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b443a">PasswordUtil</text><text x="56" y="1280" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- ITERATIONS: int [constant]</text><path d="M40 1296H470" stroke="#1b443a"/><text x="56" y="1320" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ hash(String): String</text><text x="56" y="1344" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ matches(String,String): boolean</text><text x="56" y="1368" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ isValidHash(String): boolean</text><rect x="1120" y="1210" width="440" height="228" fill="none" stroke="#1b443a"/><rect x="1120" y="1210" width="440" height="44" fill="#f1f6f0" stroke="#1b443a"/><text x="1136" y="1239" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b443a">ActivityEntry (immutable)</text><text x="1136" y="1280" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- time: String [UTC]</text><text x="1136" y="1304" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- role: String</text><text x="1136" y="1328" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- username: String</text><text x="1136" y="1352" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- event: String</text><text x="1136" y="1376" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- details: String</text><path d="M1120 1392H1560" stroke="#1b443a"/><text x="1136" y="1416" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ getDetails(): String</text><polyline points="600,160 260,160 260,300 " fill="none" stroke="#1b443a"/><polygon points="260,300 252,286 267,286" fill="#1b443a" stroke="#1b443a"/><text x="320" y="145" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">opens desktop UI</text><polyline points="1000,160 1340,160 1340,300 " fill="none" stroke="#1b443a"/><polygon points="1340,300 1332,286 1347,286" fill="#1b443a" stroke="#1b443a"/><text x="1110" y="145" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">or terminal with --cli</text><polyline points="800,207 800,650 " fill="none" stroke="#1b443a"/><polygon points="800,650 792,636 807,636" fill="#1b443a" stroke="#1b443a"/><text x="815" y="595" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">creates shared system</text><polyline points="480,425 520,425 520,760 550,760 " fill="none" stroke="#1b443a"/><polygon points="550,760 536,767 536,752" fill="#1b443a" stroke="#1b443a"/><polyline points="1120,425 1080,425 1080,760 1050,760 " fill="none" stroke="#1b443a"/><polygon points="1050,760 1063,752 1063,767" fill="#1b443a" stroke="#1b443a"/><polyline points="800,1094 800,1190 " fill="none" stroke="#1b443a"/><polygon points="800,1190 792,1176 807,1176" fill="#1b443a" stroke="#1b443a"/><text x="815" y="1150" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">loads and saves</text><polyline points="550,1320 470,1320 " fill="none" stroke="#1b443a"/><polygon points="470,1320 483,1312 483,1327" fill="#1b443a" stroke="#1b443a"/><text x="480" y="1300" font-family="monospace" font-size="13" font-weight="normal" fill="#1b443a">hashes</text><polyline points="1050,1320 1120,1320 " fill="none" stroke="#1b443a"/><polygon points="1120,1320 1106,1327 1106,1312" fill="#1b443a" stroke="#1b443a"/><text x="1060" y="1300" font-family="monospace" font-size="13" font-weight="normal" fill="#1b443a">reads</text><text x="50" y="1600" font-family="monospace" font-size="17" font-weight="normal" fill="#1b443a">Both interfaces use the same role checks, order rules, and text files. No separate server is needed.</text></svg>
