name: Java checks

on:
  push:
    branches: [main, 'feature/**']
    paths: ['src/**', 'tests/**', '*.sh', '*.bat', 'Menu.txt', '.github/workflows/java.yml']
  pull_request:
    paths: ['src/**', 'tests/**', '*.sh', '*.bat', 'Menu.txt', '.github/workflows/java.yml']

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            java: '21'
          - os: macos-latest
            java: '21'
          - os: ubuntu-latest
            java: '17'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Check Windows launchers and UI
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call test.bat --desktop
          if errorlevel 1 exit /b 1
          call build.bat
      - name: Check macOS launchers and UI
        if: runner.os == 'macOS'
        run: |
          ./test.sh --desktop
          ./build.sh
      - name: Check Java 17 and Linux UI
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./test.sh --desktop
          ./build.sh
      - name: Save screen previews and the JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: delivery-${{ matrix.os }}-java-${{ matrix.java }}
          path: |
            build/previews/*.png
            build/app/*
          retention-days: 7
