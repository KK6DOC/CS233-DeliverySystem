<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1360" viewBox="0 0 1420 1360"><rect width="100%" height="100%" fill="white"/><text x="50" y="50" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1b443a">Delivery System - class model</text><text x="50" y="82" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">Key fields and methods. + public   - private   # protected   ~ package access. Routine getters omitted.</text><rect x="480" y="115" width="440" height="228" fill="none" stroke="#1b443a"/><rect x="480" y="115" width="440" height="44" fill="#f1f6f0" stroke="#1b443a"/><text x="496" y="144" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b443a">User (abstract)</text><text x="496" y="185" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- username: String</text><text x="496" y="209" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- passwordHash: String</text><text x="496" y="233" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- email: String</text><path d="M480 249H920" stroke="#1b443a"/><text x="496" y="273" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ login(String): boolean</text><text x="496" y="297" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ getRole(): String [abstract]</text><text x="496" y="321" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ viewOptions(): void [abstract]</text><rect x="50" y="440" width="350" height="116" fill="none" stroke="#1b443a"/><rect x="50" y="440" width="350" height="44" fill="#f1f6f0" stroke="#1b443a"/><text x="66" y="469" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b443a">Admin extends User</text><text x="66" y="510" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ getRole(): String</text><text x="66" y="534" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ viewOptions(): void</text><rect x="450" y="440" width="350" height="116" fill="none" stroke="#1b443a"/><rect x="450" y="440" width="350" height="44" fill="#f1f6f0" stroke="#1b443a"/><text x="466" y="469" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b443a">Customer extends User</text><text x="466" y="510" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ getRole(): String</text><text x="466" y="534" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ viewOptions(): void</text><rect x="850" y="440" width="500" height="276" fill="none" stroke="#1b443a"/><rect x="850" y="440" width="500" height="44" fill="#f1f6f0" stroke="#1b443a"/><text x="866" y="469" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b443a">Driver extends User</text><text x="866" y="510" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- availability: boolean</text><text x="866" y="534" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- ratings: Deque&lt;Integer&gt;</text><text x="866" y="558" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- averageRating: double</text><path d="M850 574H1350" stroke="#1b443a"/><text x="866" y="598" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">~ addRating(int): void</text><text x="866" y="622" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">~ restoreRatings(Deque): void</text><text x="866" y="646" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">~ setAvailability(boolean): void</text><text x="866" y="670" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- calculateAvgRating(): void</text><text x="866" y="694" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ compareTo(Driver): int</text><rect x="50" y="850" width="350" height="228" fill="none" stroke="#1b443a"/><rect x="50" y="850" width="350" height="44" fill="#f1f6f0" stroke="#1b443a"/><text x="66" y="879" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b443a">Menu</text><text x="66" y="920" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- menu: HashMap&lt;String,MenuItem&gt;</text><path d="M50 936H400" stroke="#1b443a"/><text x="66" y="960" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ addMenuItem(MenuItem): void</text><text x="66" y="984" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ updateMenu(MenuItem): void</text><text x="66" y="1008" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ removeMenuItem(String): void</text><text x="66" y="1032" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ getItem(String): MenuItem</text><text x="66" y="1056" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ getItems(): ArrayList&lt;MenuItem&gt;</text><rect x="450" y="850" width="500" height="372" fill="none" stroke="#1b443a"/><rect x="450" y="850" width="500" height="44" fill="#f1f6f0" stroke="#1b443a"/><text x="466" y="879" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b443a">Order</text><text x="466" y="920" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- orderNum: int</text><text x="466" y="944" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- customer: String [username]</text><text x="466" y="968" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- items: ArrayList&lt;MenuItem&gt;</text><text x="466" y="992" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- status: Status [enum]</text><text x="466" y="1016" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- driver: String [username]</text><text x="466" y="1040" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- rating: int [0 = not rated]</text><path d="M450 1056H950" stroke="#1b443a"/><text x="466" y="1080" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ calculateTotalCost(): BigDecimal</text><text x="466" y="1104" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">~ assignDriver(String): void</text><text x="466" y="1128" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">~ startDelivery(): void</text><text x="466" y="1152" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">~ completeDelivery(): void</text><text x="466" y="1176" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">~ cancel(): void</text><text x="466" y="1200" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">~ rate(int): void</text><rect x="1000" y="1000" width="350" height="180" fill="none" stroke="#1b443a"/><rect x="1000" y="1000" width="350" height="44" fill="#f1f6f0" stroke="#1b443a"/><text x="1016" y="1029" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1b443a">MenuItem (immutable)</text><text x="1016" y="1070" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- name: String</text><text x="1016" y="1094" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">- price: BigDecimal</text><path d="M1000 1110H1350" stroke="#1b443a"/><text x="1016" y="1134" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ getName(): String</text><text x="1016" y="1158" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">+ getPrice(): BigDecimal</text><polyline points="225,440 225,390 700,390 700,343 " fill="none" stroke="#1b443a"/><polygon points="700,343 707,356 692,356" fill="white" stroke="#1b443a"/><polyline points="625,440 625,390 700,390 700,343 " fill="none" stroke="#1b443a"/><polygon points="700,343 707,356 692,356" fill="white" stroke="#1b443a"/><polyline points="1100,440 1100,390 700,390 700,343 " fill="none" stroke="#1b443a"/><polygon points="700,343 707,356 692,356" fill="white" stroke="#1b443a"/><polyline points="625,556 625,760 700,760 700,850 " fill="none" stroke="#1b443a"/><polygon points="700,850 692,836 707,836" fill="#1b443a" stroke="#1b443a"/><text x="640" y="740" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">places 0..* orders</text><polyline points="1100,716 1100,800 900,800 900,850 " fill="none" stroke="#1b443a"/><polygon points="900,850 892,836 907,836" fill="#1b443a" stroke="#1b443a"/><text x="1010" y="780" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">assigned driver: 0..1</text><polyline points="225,1078 225,1280 1175,1280 1175,1180 " fill="none" stroke="#1b443a"/><polygon points="1175,1180 1182,1193 1167,1193" fill="#1b443a" stroke="#1b443a"/><text x="650" y="1260" font-family="monospace" font-size="15" font-weight="normal" fill="#1b443a">stores 0..* menu items</text><polyline points="950,1050 1000,1050 " fill="none" stroke="#1b443a"/><polygon points="1000,1050 986,1057 986,1042" fill="#1b443a" stroke="#1b443a"/><text x="956" y="1033" font-family="monospace" font-size="13" font-weight="normal" fill="#1b443a">1..*</text><text x="50" y="1320" font-family="monospace" font-size="16" font-weight="normal" fill="#1b443a">Order.Status: PLACED -&gt; ACCEPTED -&gt; IN_PROGRESS -&gt; DELIVERED. PLACED may also become CANCELLED.</text></svg>
